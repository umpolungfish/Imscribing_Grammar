name = "imscrbgrmr-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ImscribingGrammar"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "ImscribingGrammar"

[[lean_lib]]
name = "Primitives"
globs = [
  "ImscribingGrammar.Primitives.Core",
  "ImscribingGrammar.Primitives.OPN_2adic",
  "ImscribingGrammar.Primitives.BSD_2adic",
  "ImscribingGrammar.Primitives.Synthon",
  "ImscribingGrammar.Primitives.TierCrossing",
  "ImscribingGrammar.Primitives.CLUPrimitives"
]

[[lean_lib]]
name = "Millennium"
globs = [
  "ImscribingGrammar.Millennium.RH",
  "ImscribingGrammar.Millennium.YM",
  "ImscribingGrammar.Millennium.Hodge",
  "ImscribingGrammar.Millennium.NS",
  "ImscribingGrammar.Millennium.PvsNP",
  "ImscribingGrammar.Millennium.OPN",
  "ImscribingGrammar.Millennium.BSD",
  "ImscribingGrammar.Millennium.Barriers",
  "ImscribingGrammar.Millennium.PrimitiveBridge",
  "ImscribingGrammar.Millennium.FrobeniusStructure"
]
