[project]
name = "imscrbgrmr"
version = "0.1.0"
description = "A 12-primitive structural grammar for encoding any system as a coordinate in the Crystal of Types"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core LLM Providers
    "anthropic>=0.40.0",
    "google-genai>=0.1.0",
    "mistralai>=1.0.0",
    "httpx>=0.27.0",
    # Configuration and utilities
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "tenacity>=8.2.0",
    # Chemistry and scientific computing
    "rdkit>=2023.9.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    # Async and concurrency
    "asyncio>=3.4.3",
    # Optional: ML-enhanced features
    "scikit-learn>=1.3.0",
    "openai>=2.33.0",
]

[project.optional-dependencies]
ml = [
    "deepchem>=2.7.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
imscribe = "imscrbgrmr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework", "imscrbgrmr", "agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
