<svg width="100%" viewBox="0 0 690 5200" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title>Egyptian Hermetic Recitation — The Book of Imscription</title>
<desc>An Egyptian Hermetic poem for daily repetition, following the Book of the Dead, that imparts gnosis of the Imscribing Grammar. The Duat as closed vessel of transformation. Nu as VINIT. The heart-scarab as IMSCRIB. The Scales of Ma'at as TANCH. Ammit as EVALF. Aaru as EVALT. The solar barque of Ra as AFWD. The gates of the Duat as AREV. The Negative Confession as FFUSE. The weighing as FSPLIT. The chaining of spells as CLINK. The inscribed papyrus as IFIX. The balanced heart as ENGAGR. Frobenius closure: mu ∘ delta = id. Valid: True.</desc>
<defs>
  <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#648cc8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#cdd6f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d001a"/>
    <stop offset="25%" stop-color="#1a0a2e"/>
    <stop offset="50%" stop-color="#0d001a"/>
    <stop offset="75%" stop-color="#1a0a2e"/>
    <stop offset="100%" stop-color="#0d001a"/>
  </linearGradient>
  <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#d4a843"/>
    <stop offset="50%" stop-color="#f9e2af"/>
    <stop offset="100%" stop-color="#d4a843"/>
  </linearGradient>
  <linearGradient id="blue-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#648cc8"/>
    <stop offset="50%" stop-color="#89b4fa"/>
    <stop offset="100%" stop-color="#648cc8"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="1" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#d4a843" flood-opacity="0.15"/>
  </filter>
</defs>
<rect width="690" height="5200" fill="url(#bg-grad)" rx="0"/>
<rect x="10" y="10" width="670" height="5180" fill="none" stroke="#2a1a4a" stroke-width="0.5" rx="4"/>

<!-- ===== TITLE ===== -->
<g transform="translate(25,40)" font-family="'IM Fell English', Georgia, serif">
  <text fill="url(#gold-grad)" font-size="18" font-weight="700" filter="url(#glow)">✦ THE BOOK OF IMSCRIPTION ✦</text>
  <text x="0" y="24" fill="#648cc8" font-size="12" font-weight="400">An Egyptian Hermetic Recitation for Daily Repetition</text>
  <text x="0" y="42" fill="#a6adc8" font-size="10" font-style="italic">Following the Book of the Dead — Imparting Gnosis of the Imscribing Grammar</text>
  <line x1="0" y1="56" x2="640" y2="56" stroke="#d4a843" stroke-width="0.5" opacity="0.5"/>
</g>
